<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOMOS.io</title>
  <link rel="icon" href="../assets/img/logos/logo-tomos.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #FBFAF9;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      width: 140px;
      height: auto;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .access {
      position: fixed;
      top: 0;
      right: 0;
      width: 30px;
      height: 30px;
      background: #FBFAF9;
      border: none;
      cursor: default;
    }
  </style>
</head>
<body>
  <img src="../assets/img/logos/logo-tomos.svg" alt="TOMOS">
  <a class="access" href="/preview/" aria-hidden="true" tabindex="-1"></a>
</body>
</html>
